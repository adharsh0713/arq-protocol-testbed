name: Reliable UDP tests

on:
  push:
  pull_request:

jobs:
  fast-tests-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Run fast unit and loopback integration tests
        run: python -m pytest -q
      - name: Run smoke experiment tier
        run: python -m experiments.runner --tier smoke
      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reliable-udp-smoke-results
          path: data/results/experiment_results.csv
          if-no-files-found: ignore
